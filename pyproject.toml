[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.9"
dependencies = [
    "fastapi>=0.165.0",
    "db-dtypes>=1.9.0",
    "google-cloud-bigquery[pandas]>=3.47.0",
    "google-cloud-storage>=3.17.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas<3",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "seaborn>=0.13.2",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
